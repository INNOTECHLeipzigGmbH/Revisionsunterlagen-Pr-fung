<!DOCTYPE html>

<head>

<title>Revisionsunterlagen-Prüfung</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb; --page: #f4f4f1; --text: #0b0b0b; --text2: #52514e; --muted: #898781;
  --line: #e1e0d9; --border: rgba(11,11,11,0.12);
  --accent: #2a78d6; --accent-dark: #184f95; --accent-soft: #e3eefb;
  --good: #0c8a0c; --good-bg: #e2f3e2; --warn: #8a5d00; --warn-bg: #fdf0cf; --bad: #b52f2f; --bad-bg: #fbe4e4;
  --info: #184f95; --info-bg: #e3eefb; --neutral-bg: #ecebe6; --violet: #6d3fd1; --violet-bg: #eee7fb;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface: #1a1a19; --page: #121211; --text: #ffffff; --text2: #c3c2bc; --muted: #8f8d86;
    --line: #2d2d2b; --border: rgba(255,255,255,0.14);
    --accent: #3987e5; --accent-dark: #86b6ef; --accent-soft: #14283f;
    --good: #4cc34c; --good-bg: #143314; --warn: #f2c40c; --warn-bg: #3a2f08; --bad: #ee7a7a; --bad-bg: #3d1717;
    --info: #86b6ef; --info-bg: #14283f; --neutral-bg: #2a2a28; --violet: #b79cf3; --violet-bg: #2a2040;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--page); color: var(--text); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
a { color: var(--accent); }

.topbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.topbar h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
.topbar .sub { color: var(--text2); font-size: 12.5px; }
.topbar .grow { flex: 1; min-width: 0; }
.savestate { font-size: 12.5px; color: var(--muted); min-width: 110px; text-align: right; }
.savestate.err { color: var(--bad); font-weight: 600; }
.wrap { max-width: 1500px; margin: 0 auto; padding: 20px 24px 60px; }

.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 7px 13px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.small { padding: 4px 9px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; color: var(--accent); padding: 0; font-weight: 600; font-size: inherit; }

input[type=text], input[type=date], input[type=number], select, textarea, input:not([type]) {
  border: 1px solid var(--border); background: var(--surface); border-radius: 7px; padding: 6px 8px; width: 100%; min-width: 0;
}
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { resize: vertical; }
label.fl { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--text2); }

/* Prüfungsliste */
.list-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.list-head h2 { margin: 0 auto 0 0; font-size: 20px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
.pcard:hover { border-color: var(--accent); }
.pcard h3 { margin: 0; font-size: 16px; }
.pcard .meta { color: var(--text2); font-size: 12.5px; }
.bar { height: 8px; border-radius: 99px; background: var(--neutral-bg); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .ok { background: var(--good); } .bar .liegt { background: #8fcf8f; } .bar .bad { background: var(--bad); }
.pcard .nums { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--text2); }
.empty { color: var(--muted); padding: 30px; text-align: center; }

/* Prüfung */
.phead { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.phead-top { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.phead h2 { margin: 0; font-size: 20px; }
.phead .meta { color: var(--text2); font-size: 13px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 14px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi b { display: block; font-size: 22px; line-height: 1.1; }
.kpi span { color: var(--text2); font-size: 12px; }
.kpi.k-bad b { color: var(--bad); } .kpi.k-good b { color: var(--good); }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 9px 14px; font-weight: 600; color: var(--text2); border-bottom: 3px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }

.check-layout { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; }
.side { position: sticky; top: 74px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; max-height: calc(100vh - 90px); overflow: auto; }
.side .s-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; border-radius: 8px; padding: 7px 8px; }
.side .s-item:hover { background: var(--accent-soft); }
.side .s-item[aria-current="true"] { background: var(--accent-soft); color: var(--accent-dark); font-weight: 700; }
.side .s-item.off { opacity: .55; }
.side .s-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side .s-n { font-size: 12px; color: var(--text2); font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; background: var(--neutral-bg); border: 1px solid var(--border); }
.dot.ok { background: var(--good); border-color: var(--good); } .dot.part { background: var(--accent); border-color: var(--accent); } .dot.bad { background: var(--bad); border-color: var(--bad); }
.side .s-foot { border-top: 1px solid var(--line); margin-top: 6px; padding: 8px 8px 4px; font-size: 12.5px; color: var(--text2); display: flex; flex-direction: column; gap: 6px; }
.side .s-check { display: flex; gap: 6px; align-items: center; }
.side .s-check input { width: auto; }

.gw-head { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display: grid; grid-template-columns: minmax(0,1fr) minmax(220px, 340px); gap: 12px 18px; align-items: start; }
.gw-head h3 { margin: 0; font-size: 18px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text2); }
.chip.folder { background: var(--violet-bg); color: var(--violet); border-color: transparent; font-family: ui-monospace, Consolas, monospace; font-weight: 600; }
.chip.good { background: var(--good-bg); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.toolbar input[type=search], .toolbar .q { max-width: 280px; }
.fchip { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--text2); }
.fchip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }

.grp { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.grp-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--neutral-bg); border: 0; width: 100%; text-align: left; font-weight: 700; flex-wrap: wrap; }
.grp-h .gh-n { margin-left: auto; font-weight: 600; font-size: 12.5px; color: var(--text2); }
.cols, .row { display: grid; grid-template-columns: minmax(240px, 1.7fr) 130px 118px 128px 150px minmax(160px, 1.1fr) 74px; gap: 8px; align-items: start; padding: 8px 12px; }
.cols { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--line); padding-top: 7px; padding-bottom: 7px; }
.row { border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent) 4%, transparent); }
.r-text { white-space: pre-wrap; word-break: break-word; padding-top: 4px; display: flex; gap: 8px; }
.r-text .nr { color: var(--muted); min-width: 22px; font-variant-numeric: tabular-nums; }
.subhead { padding: 9px 14px 3px; font-weight: 700; color: var(--text2); background: var(--surface); border-bottom: 1px dashed var(--line); }
.row select, .row input, .row textarea { padding: 5px 7px; font-size: 13px; }
.row textarea { min-height: 31px; height: 31px; overflow: hidden; }
.row textarea:focus { height: 72px; overflow: auto; }
.v-ja { background: var(--good-bg) !important; color: var(--good); font-weight: 600; }
.v-nein { background: var(--bad-bg) !important; color: var(--bad); font-weight: 600; }
.v-sieheb { background: var(--warn-bg) !important; color: var(--warn); font-weight: 600; }
.s-geprueft { background: var(--good-bg) !important; color: var(--good); font-weight: 600; }
.s-mangel { background: var(--bad-bg) !important; color: var(--bad); font-weight: 600; }
.s-pruefung, .s-angefordert { background: var(--info-bg) !important; color: var(--info); font-weight: 600; }
.s-nicht_erforderlich { background: var(--neutral-bg) !important; color: var(--muted); }
.row.ne .r-text { color: var(--muted); text-decoration: line-through; }
.late { border-color: var(--bad) !important; color: var(--bad); }
.r-act { display: flex; gap: 4px; }
.iconbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 7px; min-width: 31px; height: 31px; padding: 0 6px; font-weight: 700; font-size: 12px; color: var(--text2); }
.iconbtn:hover { border-color: var(--accent); color: var(--accent); }
.iconbtn.on { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.iconbtn.has { border-color: var(--accent); color: var(--accent-dark); background: var(--accent-soft); }

/* Protokoll */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; }
.card h3 { margin: 0 0 10px; font-size: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pitem { display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(220px, 1fr); gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: start; }
.pitem .pn { font-weight: 700; color: var(--muted); }
.pitem .pt { white-space: pre-wrap; }
.pitem textarea { min-height: 62px; }

/* Ordner */
.tree { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; columns: 2 300px; column-gap: 24px; }
.tree div { break-inside: avoid; padding: 1px 0; }
.tree .sub { padding-left: 18px; color: var(--text2); }
.otable { width: 100%; border-collapse: collapse; font-size: 13px; }
.otable th, .otable td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.otable th { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.otable .sub-chip { display: inline-block; margin: 1px 4px 1px 0; }
.note { color: var(--text2); font-size: 12.5px; }

/* Dialog */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; }
.modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 640px; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal-h { display: flex; align-items: center; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.modal-h h3 { margin: 0 auto 0 0; font-size: 17px; }
.modal-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.modal-f { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.files { display: flex; flex-direction: column; gap: 6px; }
.frow { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
.frow a { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.frow small { color: var(--muted); }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--surface); padding: 9px 16px; border-radius: 9px; font-size: 13px; z-index: 300; }

/* Druck */
#print-root { display: none; }
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff !important; color: #000 !important; font-size: 10pt; }
  #app, .topbar, #modal-root, .toast { display: none !important; }
  #print-root { display: block !important; }
  #print-root h1 { font-size: 15pt; margin: 0 0 4px; }
  #print-root h2 { font-size: 12pt; margin: 14px 0 4px; break-after: avoid; color: #000; border-bottom: 2px solid #41525b; padding: 4px 0 2px; }
  #print-root h3 { font-size: 10pt; margin: 8px 0 2px; break-after: avoid; }
  #print-root table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  #print-root th, #print-root td { border: 1px solid #999; padding: 2px 5px; text-align: left; vertical-align: top; font-size: 8.5pt; }
  #print-root th { background: #eee; }
  #print-root tr { break-inside: avoid; }
  #print-root .meta { margin: 0 0 6px; font-size: 9pt; }
  #print-root .sum { margin: 6px 0; font-size: 9pt; }
}

@media (max-width: 980px) {
  .check-layout { grid-template-columns: 1fr; }
  .side { position: static; max-height: none; }
  .cols { display: none; }
  .row { grid-template-columns: 1fr 1fr; }
  .row .r-text, .row .r-bem-wrap { grid-column: 1 / -1; }
  .gw-head { grid-template-columns: 1fr; }
  .pitem { grid-template-columns: 1fr; }
  .wrap { padding: 14px 12px 50px; }
}
</style>

/* ============ Helfer ============ */
function $(s, r = document) { return r.querySelector(s); }
function $$(s, r = document) { return Array.from(r.querySelectorAll(s)); }
function esc(s) { return (s == null ? "" : String(s)).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function todayIso() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function fmtDate(iso) { if (!iso) return ""; const [y, m, d] = String(iso).slice(0, 10).split("-"); return `${d}.${m}.${y}`; }
function fmtSize(n) { n = Number(n) || 0; return n < 1048576 ? Math.max(1, Math.round(n / 1024)) + " KB" : (n / 1048576).toFixed(1).replace(".", ",") + " MB"; }
function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
function newId() { return "rev-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function slug(s) { return String(s).normalize("NFKD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9._-]+/g, "_").replace(/^_+|_+$/g, "").slice(-80) || "datei"; }
/* Vergleichsschreibweise für Ordnernamen: Umlaute aufgelöst, nur Buchstaben/Ziffern, klein */
function normName(s) {
  return String(s).normalize("NFC").toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "");
}

/* ============ Datenzugriff ============ */
const HEAD = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" };
async function api(path, { method = "GET", body, prefer } = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    method, headers: { ...HEAD, ...(prefer ? { Prefer: prefer } : {}) }, body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) { let m = ""; try { m = (await res.json()).message; } catch (e) {} throw new Error(m || `HTTP ${res.status}`); }
  const t = await res.text();
  return t ? JSON.parse(t) : null;
}
async function apiAll(path) {
  const out = [];
  for (let off = 0; off < 50000; off += 1000) {
    const rows = await api(`${path}${path.includes("?") ? "&" : "?"}limit=1000&offset=${off}`);
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}

/* ---------- Speichern (entprellt) ---------- */
const pendingPunkte = new Map();   // punkt_id -> timer
let pendingHead = null;
let inflight = 0;
function setSave(state) {
  const el = $("#savestate"); if (!el) return;
  el.className = "savestate" + (state === "err" ? " err" : "");
  el.textContent = state === "busy" ? "Speichere …" : state === "ok" ? "Gespeichert ✓" : state === "err" ? "Speichern fehlgeschlagen" : "";
}
function schedulePunkt(id) {
  clearTimeout(pendingPunkte.get(id));
  setSave("busy");
  pendingPunkte.set(id, setTimeout(() => flushPunkt(id), 600));
}
async function flushPunkt(id) {
  pendingPunkte.delete(id);
  if (!CUR) return;
  const r = PUNKTE[id]; if (!r) return;
  inflight++;
  try {
    await api("revision_punkte?on_conflict=pruefung_id,punkt_id", {
      method: "POST", prefer: "resolution=merge-duplicates,return=minimal",
      body: { pruefung_id: CUR.id, punkt_id: id, verantwortlich: r.verantwortlich ?? null, vorliegend: r.vorliegend || null, termin: r.termin || null, status: r.status || null, bemerkung: r.bemerkung || null, anhaenge: r.anhaenge || [] },
    });
    setSave(pendingPunkte.size ? "busy" : "ok");
  } catch (e) { setSave("err"); console.error(e); }
  inflight--;
}
function scheduleHead() {
  clearTimeout(pendingHead); setSave("busy");
  pendingHead = setTimeout(flushHead, 700);
}
async function flushHead() {
  pendingHead = null;
  if (!CUR) return;
  const c = CUR;
  inflight++;
  try {
    await api(`revision_pruefungen?id=eq.${encodeURIComponent(c.id)}`, {
      method: "PATCH", prefer: "return=minimal",
      body: { markt: c.markt, marktnummer: c.marktnummer || null, region: c.region || null, besitz: c.besitz || null, art: c.art || null, status_text: c.status_text || null, eroeffnung: c.eroeffnung || null, stand: c.stand || null, bauherr: c.bauherr || null, rev_unterlagen: c.rev_unterlagen || null, scope: c.scope || {}, firmen: c.firmen || {}, protokoll: c.protokoll || {}, ordner_check: c.ordner_check || null, archiviert: !!c.archiviert },
    });
    setSave(pendingHead ? "busy" : "ok");
  } catch (e) { setSave("err"); console.error(e); }
  inflight--;
}
async function flushAll() {
  for (const id of [...pendingPunkte.keys()]) { clearTimeout(pendingPunkte.get(id)); await flushPunkt(id); }
  if (pendingHead) { clearTimeout(pendingHead); await flushHead(); }
}

/* ---------- Auswertung ---------- */
function inScope(pr, key) {
  const s = pr.scope || {};
  return key in s ? !!s[key] : DEFAULT_SCOPE.includes(key);
}
function punktOf(rows, id) { return (rows && rows[id]) || {}; }
function itemVal(rows, id) {
  const r = punktOf(rows, id), t = ITEMS[id].item;
  return {
    verantwortlich: r.verantwortlich != null ? r.verantwortlich : (t.verantw || ""),
    vorliegend: r.vorliegend || "", termin: r.termin || "", status: r.status || "", bemerkung: r.bemerkung || "", anhaenge: r.anhaenge || [],
  };
}
/* Kennzahlen: nur Prüfpunkte der aktiven Gewerke, ohne Überschriften und ohne „Nicht erforderlich“ */
function kpis(pr, rows, onlyKey) {
  const k = { total: 0, liegt: 0, ok: 0, mangel: 0, offen: 0, ne: 0, faellig: 0 };
  const today = todayIso();
  Object.keys(ITEMS).forEach(id => {
    const { sec, item } = ITEMS[id];
    if (item.head || (onlyKey ? sec.key !== onlyKey : !inScope(pr, sec.key))) return;
    const v = itemVal(rows, id);
    if (v.status === "nicht_erforderlich") { k.ne++; return; }
    k.total++;
    if (v.vorliegend === "Ja") k.liegt++;
    if (v.status === "geprueft") k.ok++;
    else if (v.status === "mangel") k.mangel++;
    if (v.status !== "geprueft") { k.offen++; if (v.termin && v.termin < today) k.faellig++; }
  });
  return k;
}
function secKpi(pr, rows, key) { return kpis(pr, rows, key); }

/* ============ Ansicht: Prüfung ============ */
async function openPruefung(id) {
  await flushAll();
  CUR = PRUEFUNGEN.find(p => p.id === id);
  if (!CUR) return renderListe();
  CUR.scope = CUR.scope || {}; CUR.firmen = CUR.firmen || {}; CUR.protokoll = CUR.protokoll || {};
  PUNKTE = {};
  try { (await apiAll(`revision_punkte?pruefung_id=eq.${encodeURIComponent(id)}&select=*`)).forEach(r => { PUNKTE[r.punkt_id] = r; }); } catch (e) { alert("Laden fehlgeschlagen: " + e.message); }
  tab = "check";
  const first = TEMPLATE.sections.find(s => inScope(CUR, s.key));
  secKey = first ? first.key : TEMPLATE.sections[0].key;
  try { history.replaceState(null, "", `?p=${encodeURIComponent(id)}`); } catch (e) {}
  renderPruefung();
}

  $("#btn-home").hidden = false;

function kpiHtml(k) {

function passFilter(id) {
  const v = itemVal(PUNKTE, id), it = ITEMS[id].item;
  if (fil.q) { const q = fil.q.toLowerCase(); if (!(`${it.text} ${v.bemerkung} ${v.verantwortlich}`).toLowerCase().includes(q)) return false; }
  const today = todayIso();
  switch (fil.f) {
    case "offen": return v.status !== "geprueft" && v.status !== "nicht_erforderlich";
    case "nicht_da": return v.vorliegend !== "Ja" && v.status !== "nicht_erforderlich";
    case "mangel": return v.status === "mangel";
    case "faellig": return !!v.termin && v.termin < today && v.status !== "geprueft" && v.status !== "nicht_erforderlich";
    default: return true;
  }
}

function putFile(path, file, onProgress) {

    x.setRequestHeader("x-upsert", "false"); x.setRequestHeader("Content-Type", file.type || "application/octet-stream");
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100)); };
    x.onload = () => (x.status >= 200 && x.status < 300) ? resolve() : reject(new Error("Upload abgelehnt (" + x.status + ")"));
    x.onerror = () => reject(new Error("Verbindung unterbrochen"));
    x.send(file);
  });
}

/* ============ Ordnerprüfung ============ */
const IGNORIERT = /^(\.ds_store|thumbs\.db|desktop\.ini|~\$.*)$/i;
function ordnerNr(name) { const m = /^\s*(\d{1,2})(?=[\s._-]|$)/.exec(name); return m ? parseInt(m[1], 10) : null; }
/* Ordnet einen vorgefundenen Namen einem erwarteten Namen zu: exakt, gleiche Schreibweise (Umlaute, Bindestriche, Leerzeichen) oder gleiche Nummer */
function matchName(name, erwartet) {
  const idx = erwartet.findIndex(e => e === name);
  if (idx >= 0) return { idx, art: "exakt" };
  const n = normName(name);
  const j = erwartet.findIndex(e => normName(e) === n);
  if (j >= 0) return { idx: j, art: "schreibweise" };
  const ohneNr = e => normName(e.replace(/^\s*\d{1,2}[\s._-]*/, ""));
  const l = erwartet.findIndex(e => ohneNr(e) === n);
  if (l >= 0) return { idx: l, art: "nummer-fehlt" };
  const nr = ordnerNr(name);
  if (nr != null) { const k = erwartet.findIndex(e => ordnerNr(e) === nr); if (k >= 0) return { idx: k, art: "nummer" }; }
  return null;
}
/* paths: Dateipfade wie „Projekt/03_Elektro/01_Abnahme/x.pdf“. Liefert das Prüfergebnis (ohne Dateinamen) */
function analyseOrdner(paths, scopeOrdner) {
  const files = paths.map(p => String(p).normalize("NFC").split("/").filter(s => s !== "")).filter(seg => seg.length && !IGNORIERT.test(seg[seg.length - 1]));
  // Ebene suchen, auf der die Ordner 00 bis 16 liegen (gewählter Ordner selbst, ein oder zwei Ebenen tiefer)
  let best = { d: 1, n: -1 };
  for (let d = 1; d <= 3; d++) {
    const names = new Set(files.filter(s => s.length > d + 1).map(s => s[d]));
    let n = 0; names.forEach(nm => { if (matchName(nm, ORDNER)) n++; });
    if (n > best.n) best = { d, n };
  }
  const d = best.d;
  const root = files.length && files[0].length > d - 1 ? files[0].slice(0, d).join("/") : "";
  const res = { root, ebene: d, dateien: files.length, ordner: {}, issues: [], extra: [], wurzel: {} };
  const inScope = o => !scopeOrdner || scopeOrdner.has(o);
  const brauchtUnter = (o, u) => !scopeOrdner || !scopeOrdner.get || (scopeOrdner.get(o) || new Set()).has(u);
  // Dateien im Wurzelordner
  const wurzelDat = files.filter(s => s.length === d + 1).map(s => s[d]);
  ROOT_DATEIEN.forEach(rd => { res.wurzel[rd.name] = wurzelDat.some(n => rd.re.test(n)); });
  // Ordner einsammeln
  const byFolder = new Map(); // erwarteter Index -> { actual, files:[segmente ab Ordner] }
  const extraTop = new Map();
  files.forEach(s => {
    if (s.length <= d + 1) return;           // Datei direkt im Wurzelordner
    const top = s[d], m = matchName(top, ORDNER);
    if (!m) { extraTop.set(top, (extraTop.get(top) || 0) + 1); return; }
    if (!byFolder.has(m.idx)) byFolder.set(m.idx, { actual: top, art: m.art, list: [] });
    byFolder.get(m.idx).list.push(s.slice(d + 1));
  });
  extraTop.forEach((n, nm) => res.extra.push({ name: nm, dateien: n }));
  ORDNER.forEach((name, i) => {
    const f = byFolder.get(i);
    const o = { fehlt: !f, actual: f ? f.actual : "", gesamt: f ? f.list.length : 0, direkt: 0, unter: {}, extra: [] };
    const sub = new Map(); const extraSub = new Map();
    if (f) {
      f.list.forEach(seg => {
        if (seg.length === 1) { o.direkt++; return; }
        const m = matchName(seg[0], UNTER);
        if (!m) { extraSub.set(seg[0], (extraSub.get(seg[0]) || 0) + 1); return; }
        if (!sub.has(m.idx)) sub.set(m.idx, { actual: seg[0], art: m.art, n: 0 });
        sub.get(m.idx).n++;
      });
    }
    UNTER.forEach((u, j) => { const s = sub.get(j); o.unter[u] = { fehlt: !s, dateien: s ? s.n : 0, actual: s ? s.actual : "" }; });
    extraSub.forEach((n, nm) => o.extra.push({ name: nm, dateien: n }));
    res.ordner[name] = o;
    if (!inScope(name)) return;
    if (!f) { res.issues.push({ typ: "fehlt", ordner: name, text: "Ordner fehlt oder ist leer" }); return; }
    if (f.art !== "exakt") res.issues.push({ typ: "name", ordner: name, text: `Falsch benannt: „${f.actual}“ statt „${name}“` });
    if (o.direkt) res.issues.push({ typ: "direkt", ordner: name, text: `${o.direkt} Datei(en) liegen direkt im Gewerkordner, nicht in einem Unterordner` });
    UNTER.forEach((u, j) => {
      const s = sub.get(j);
      if (!s) { if (brauchtUnter(name, u)) res.issues.push({ typ: "leer", ordner: name, unter: u, text: `Unterordner ${u} fehlt oder ist leer` }); }
      else if (s.art !== "exakt") res.issues.push({ typ: "name", ordner: name, unter: u, text: `Falsch benannt: „${s.actual}“ statt „${u}“` });
    });
    o.extra.forEach(e => res.issues.push({ typ: "extra", ordner: name, text: `Unbekannter Unterordner „${e.name}“ (${e.dateien} Dateien)` }));
  });
  res.extra.forEach(e => res.issues.push({ typ: "extra", ordner: "(Wurzel)", text: `Unbekannter Ordner „${e.name}“ (${e.dateien} Dateien)` }));
  ROOT_DATEIEN.forEach(rd => { if (!res.wurzel[rd.name]) res.issues.push({ typ: "wurzel", ordner: "(Wurzel)", text: `${rd.name} fehlt im Hauptordner (z. B. ${rd.beispiel})` }); });
  return res;
}

  TEMPLATE.sections.forEach(sec => {

  return m;
}

      <label style="display:flex;gap:8px;align-items:center;margin-bottom:10px"><input type="checkbox" id="ex-nur" style="width:auto"> Nur offene Punkte und Mängel drucken</label>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><input type="checkbox" id="ex-prot" style="width:auto" checked> Protokoll BPM → TFM mitdrucken</label>
      <button type="button" class="btn primary" data-act="print">Drucken / als PDF speichern</button></div>
    <div class="card"><h3>Stand</h3><p style="margin:0">${k.ok} von ${k.total} Prüfpunkten geprüft, ${k.liegt} liegen vor${k.mangel ? `, <b style="color:var(--bad)">${k.mangel} Mängel</b>` : ""}${k.faellig ? `, ${k.faellig} Termine überschritten` : ""}.</p></div>`;
}
function buildPrint(nurOffen, mitProt) {
  const p = CUR, k = kpis(p, PUNKTE);
  let h = `<h1>Revisionsunterlagen-Prüfung · ${esc(p.markt)}${p.marktnummer ? " · " + esc(p.marktnummer) : ""}</h1>
    <div class="meta">${[p.region, p.besitz, p.art, p.eroeffnung ? "EÖ " + fmtDate(p.eroeffnung) : "", "Stand " + fmtDate(p.stand || todayIso()), p.bauherr ? "Bauherr: " + p.bauherr : ""].filter(Boolean).map(esc).join(" · ")}</div>
    <div class="sum"><b>${k.ok}</b> von ${k.total} Prüfpunkten geprüft · ${k.liegt} liegen vor · ${k.mangel} Mängel · ${k.offen} offen${k.faellig ? " · " + k.faellig + " Termine überschritten" : ""}</div>`;
  TEMPLATE.sections.filter(s => inScope(p, s.key)).forEach(sec => {
    let body = "";
    sec.groups.forEach(grp => {
      let head = null, rows = "";
      grp.items.forEach(it => {
        if (it.head) { head = it; return; }
        const v = itemVal(PUNKTE, it.id);
        if (nurOffen && (v.status === "geprueft" || v.status === "nicht_erforderlich")) return;
        if (head) { rows += `<tr><td colspan="7"><b>${esc(head.text)}</b></td></tr>`; head = null; }
        const n = (v.anhaenge || []).filter(a => !a.entfernt).length;
        rows += `<tr><td>${ITEMS[it.id].nr}</td><td style="white-space:pre-wrap">${esc(it.text)}</td><td>${esc(v.verantwortlich)}</td><td>${esc(v.vorliegend)}</td><td>${esc(fmtDate(v.termin))}</td><td>${esc(STATUS_LABEL[v.status] || "Offen")}</td><td style="white-space:pre-wrap">${esc(v.bemerkung)}${n ? ` <i>(${n} Anhang/Anhänge)</i>` : ""}</td></tr>`;
      });
      if (rows) body += `<tr><td colspan="7" style="background:#f6f6f6"><b>${esc(grp.name)}</b>${grp.unter ? " · " + esc(sec.ordner) + "\\" + esc(grp.unter) : ""}</td></tr>${rows}`;
    });
    if (!body) return;
    const kk = secKpi(p, PUNKTE, sec.key);
    h += `<h2>${esc(sec.name)} <span style="font-weight:400;font-size:9pt">· ${kk.ok}/${kk.total} geprüft${p.firmen[sec.key] ? " · Firma: " + esc(p.firmen[sec.key]) : ""}</span></h2>
      <table><thead><tr><th style="width:3%">Nr.</th><th>Prüfpunkt</th><th style="width:11%">Verantwortlich</th><th style="width:8%">Vorliegend</th><th style="width:8%">Termin</th><th style="width:9%">Status</th><th style="width:20%">Bemerkung</th></tr></thead><tbody>${body}</tbody></table>`;
  });
  if (mitProt) {
    const pr = p.protokoll || {};
    h += `<h2 style="break-before:page">Protokoll Objektübergabe · BPM an TFM</h2>
      <div class="meta">${PROT_FELDER.map(([key, l]) => pr[key] ? `${esc(l)}: <b>${esc(pr[key])}</b>` : "").filter(Boolean).join(" · ")}</div>`;
    TEMPLATE.bpm.forEach(sec => {
      h += `<h3>${esc(sec.name)}</h3><table><thead><tr><th style="width:4%">Nr.</th><th style="width:48%">Punkt</th><th>Kommentar</th></tr></thead><tbody>${sec.items.map(it => `<tr><td>${esc(it.nr)}</td><td style="white-space:pre-wrap">${esc(it.text)}</td><td style="white-space:pre-wrap">${esc(bpmComment(it.id))}</td></tr>`).join("")}</tbody></table>`;
    });
  }
  return h;
}
function doPrint() {
  $("#print-root").innerHTML = buildPrint($("#ex-nur") && $("#ex-nur").checked, !$("#ex-prot") || $("#ex-prot").checked);
  setTimeout(() => window.print(), 50);
}


/* ============ Excel-Export im Layout der Vorlage ============ */
function xmlEsc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, ""); }
function serialDate(iso) {
  const [y, m, d] = String(iso).slice(0, 10).split("-").map(Number);
  return Math.round((Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 86400000);
}
/* Sammelt Zellenänderungen und wendet sie in einem Durchlauf auf das Sheet-XML an */
function XlsxEdit(xml) {
  const edits = [];
  const find = ref => {
    const key = `<c r="${ref}"`; const i = xml.indexOf(key);
    if (i < 0) return null;
    const gt = xml.indexOf(">", i);
    const selfClosed = xml[gt - 1] === "/";
    const end = selfClosed ? gt + 1 : xml.indexOf("</c>", gt) + 4;
    const m = /\ss="(\d+)"/.exec(xml.slice(i, gt + 1));
    return { start: i, end, s: m ? m[1] : null };
  };
  const mk = (ref, s, inner, t) => `<c r="${ref}"${s != null ? ` s="${s}"` : ""}${t ? ` t="${t}"` : ""}>${inner}</c>`;
  return {
    text(ref, val) {
      const c = find(ref); if (!c) return false;
      const v = String(val);
      edits.push({ start: c.start, end: c.end, rep: mk(ref, c.s, `<is><t xml:space="preserve">${xmlEsc(v)}</t></is>`, "inlineStr") });
      return true;
    },
    num(ref, n) {
      const c = find(ref); if (!c) return false;
      edits.push({ start: c.start, end: c.end, rep: mk(ref, c.s, `<v>${n}</v>`) });
      return true;
    },
    clear(ref) { const c = find(ref); if (!c) return false; edits.push({ start: c.start, end: c.end, rep: mk(ref, c.s, "") }); return true; },
    formula(ref, f, val) {
      const c = find(ref); if (!c) return false;
      const isNum = typeof val === "number";
      edits.push({ start: c.start, end: c.end, rep: mk(ref, c.s, `<f>${xmlEsc(f)}</f><v>${isNum ? val : xmlEsc(val)}</v>`, isNum ? "" : "str") });
      return true;
    },
    apply() {
      edits.sort((a, b) => a.start - b.start);
      let out = "", pos = 0;
      for (const e of edits) { if (e.start < pos) continue; out += xml.slice(pos, e.start) + e.rep; pos = e.end; }
      return out + xml.slice(pos);
    },
  };
}
function xlsxFileName(p) {
  const d = todayIso().replace(/-/g, "");
  return `${d}_Objektuebergabe_IP_FM_${slug(p.marktnummer || "")}_${slug(p.markt)}.xlsx`.replace(/__+/g, "_");
}
async function exportXlsx(pr, rows) {
  if (typeof JSZip === "undefined") throw new Error("ZIP-Bibliothek nicht geladen (Internetverbindung?)");
  const zip = await JSZip.loadAsync(XLSX_B64, { base64: true });
  const prot = pr.protokoll || {};
  const nr = String(pr.marktnummer || "").trim();
  const nrVal = /^\d+$/.test(nr) ? Number(nr) : nr;

  /* Blatt 1: Protokoll BPM an TFM */
  const f1 = zip.file("xl/worksheets/sheet1.xml");
  const s1 = XlsxEdit(await f1.async("string"));
  s1.text("E4", pr.markt || "");
  if (nr) { typeof nrVal === "number" ? s1.num("I4", nrVal) : s1.text("I4", nrVal); }
  if (pr.region) s1.text("E6", pr.region);
  if (pr.besitz) s1.text("I6", pr.besitz);
  [["plbpm", "E9"], ["tfm", "I9"], ["plexp", "E11"], ["plkfm", "I11"], ["plkaelte", "E13"], ["otfm", "I13"]].forEach(([k, ref]) => { if (prot[k]) s1.text(ref, prot[k]); });
  TEMPLATE.bpm.forEach(sec => sec.items.forEach(it => { const c = bpmComment(it.id); if (c) s1.text("G" + it.row, c); }));
  zip.file("xl/worksheets/sheet1.xml", s1.apply());

  /* Blatt 2: Checkliste Übergabe IP an FM */
  const f2 = zip.file("xl/worksheets/sheet2.xml");
  const s2 = XlsxEdit(await f2.async("string"));
  s2.formula("C4", "'BPM an FM'!E4", pr.markt || "");
  s2.formula("G4", "'BPM an FM'!I4", nrVal === "" ? "" : nrVal);
  s2.text("C6", pr.art || "");
  s2.text("G6", pr.besitz || "");
  if (pr.eroeffnung) s2.num("C8", serialDate(pr.eroeffnung)); else s2.clear("C8");
  s2.text("G8", pr.bauherr || "");
  s2.num("C10", serialDate(pr.stand || todayIso()));
  s2.text("G10", pr.rev_unterlagen || "");
  Object.keys(ITEMS).forEach(id => {
    const { item } = ITEMS[id];
    if (item.head || !rows[id]) return;
    const v = itemVal(rows, id), r = item.row;
    s2.text("I" + r, v.verantwortlich || "");
    s2.text("J" + r, v.vorliegend || "Bitte auswählen");
    if (v.termin) s2.text("K" + r, fmtDate(v.termin)); else s2.clear("K" + r);
    const lbl = v.status ? STATUS_LABEL[v.status] : "";
    if (lbl) s2.text("L" + r, lbl); else s2.clear("L" + r);
    const n = (v.anhaenge || []).filter(a => !a.entfernt).length;
    const bem = v.bemerkung || "";
    if (bem) s2.text("M" + r, bem + (n ? `\n(${n} Anhang/Anhänge in der Revisionsprüfung)` : ""));
  });
  zip.file("xl/worksheets/sheet2.xml", s2.apply());

  /* Arbeitsmappe beim Öffnen neu berechnen lassen */
  const wbf = zip.file("xl/workbook.xml");
  let wb = await wbf.async("string");
  wb = /<calcPr[^>]*\/>/.test(wb) ? wb.replace(/<calcPr[^>]*\/>/, '<calcPr fullCalcOnLoad="1"/>') : wb.replace("</workbook>", '<calcPr fullCalcOnLoad="1"/></workbook>');
  zip.file("xl/workbook.xml", wb);

  return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", compression: "DEFLATE" });
}
async function doXlsx() {
  const st = $("#x-stat"); if (st) st.textContent = "Wird erstellt …";
  try {
    await flushAll();
    const blob = await exportXlsx(CUR, PUNKTE);
    download(blob, xlsxFileName(CUR));
    if (st) st.textContent = "Fertig.";
  } catch (e) { if (st) st.textContent = "Fehlgeschlagen: " + e.message; console.error(e); }
}


/* ============ Stammdaten, Archiv ============ */
function stammDialog() {
  const p = CUR;
  openModal(`<div class="modal-h"><h3>Stammdaten</h3><button type="button" class="btn small" data-act="close">✕</button></div>
  <div class="modal-b"><div class="grid2">
    <label class="fl">Markt (Ort) *<input id="s-markt" value="${esc(p.markt)}"></label>
    <label class="fl">Marktnummer<input id="s-nr" value="${esc(p.marktnummer || "")}"></label>
    <label class="fl">Region<select id="s-region"><option value="">–</option>${REGIONEN.map(r => `<option ${r === p.region ? "selected" : ""}>${r}</option>`).join("")}</select></label>
    <label class="fl">Besitzverhältnis<select id="s-besitz"><option value="">–</option>${BESITZ.map(r => `<option ${r === p.besitz ? "selected" : ""}>${r}</option>`).join("")}</select></label>
    <label class="fl">Art<input id="s-art" value="${esc(p.art || "")}"></label>
    <label class="fl">Eröffnung (EÖ)<input id="s-eo" type="date" value="${esc(p.eroeffnung || "")}"></label>
    <label class="fl">Stand<input id="s-stand" type="date" value="${esc(p.stand || "")}"></label>
    <label class="fl">Bauherr<input id="s-bauherr" value="${esc(p.bauherr || "")}"></label>
    <label class="fl" style="grid-column:1/-1">Revisionsunterlagen (Vermerk für die Excel-Datei)<input id="s-rev" value="${esc(p.rev_unterlagen || "")}"></label>
  </div></div>
  <div class="modal-f"><button type="button" class="btn" data-act="close">Abbrechen</button><button type="button" class="btn primary" data-act="stamm-save">Speichern</button></div>`);
}
function stammSpeichern() {
  const markt = ($("#s-markt").value || "").trim();
  if (!markt) { $("#s-markt").focus(); return; }
  const g = id => ($(id).value || "").trim();
  Object.assign(CUR, { markt, marktnummer: g("#s-nr") || null, region: $("#s-region").value || null, besitz: $("#s-besitz").value || null, art: g("#s-art") || null, eroeffnung: $("#s-eo").value || null, stand: $("#s-stand").value || null, bauherr: g("#s-bauherr") || null, rev_unterlagen: g("#s-rev") || null });
  CUR.protokoll = Object.assign(CUR.protokoll || {}, { markt, marktnummer: CUR.marktnummer || "", region: CUR.region || "", besitz: CUR.besitz || "" });
  scheduleHead(); closeModal(); renderPruefung();
}
async function archivieren() {
  const neu = !CUR.archiviert;
  if (neu && !confirm("Diesen Markt archivieren? Er verschwindet aus der Übersicht, bleibt aber erhalten.")) return;
  CUR.archiviert = neu;
  await flushHead();
  zurueck();
}
async function zurueck() {
  await flushAll();
  try { history.replaceState(null, "", location.pathname); } catch (e) {}
  try { await loadListe(); } catch (e) {}
  renderListe();
}

/* ============ Ereignisse ============ */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const act = t.dataset.act;
  switch (act) {
    case "toggle-archiv": showArchiv = !showArchiv; renderListe(); break;
    case "neu": neuDialog(); break;
    case "neu-save": neuSpeichern(); break;
    case "open": openPruefung(t.dataset.id); break;
    case "close": closeModal(); break;
    case "stamm": stammDialog(); break;
    case "stamm-save": stammSpeichern(); break;
    case "archiv": archivieren(); break;
    case "tab": tab = t.dataset.t; renderTab(); break;
    case "sec": secKey = t.dataset.k; renderSidebar(); renderGewerk(); break;
    case "filter": fil.f = t.dataset.v; renderGewerk(); break;
    case "alle-zu": SEC[secKey].groups.forEach(g => collapsed.add(secKey + "/" + g.key)); renderGruppen(); break;
    case "alle-auf": SEC[secKey].groups.forEach(g => collapsed.delete(secKey + "/" + g.key)); renderGruppen(); break;
    case "grp": { const g = t.dataset.g; collapsed.has(g) ? collapsed.delete(g) : collapsed.add(g); renderGruppen(); break; }
    case "quick": {
      const id = t.dataset.id, v = itemVal(PUNKTE, id);
      if (v.status === "geprueft" && v.vorliegend === "Ja") setField(id, { status: "", vorliegend: "" });
      else setField(id, { status: "geprueft", vorliegend: "Ja" });
      renderGruppen(); refreshKpis(); break;
    }
    case "anhang": anhangDialog(t.dataset.id); break;
    case "a-del": {
      const id = t.dataset.id, cur = itemVal(PUNKTE, id).anhaenge || [];
      setField(id, { anhaenge: cur.map(a => a.path === t.dataset.p ? Object.assign({}, a, { entfernt: true }) : a) });
      const box = $("#a-files"); if (box) box.innerHTML = filesHtml(id);
      const row = $(`.row[data-id="${id}"]`); if (row) row.outerHTML = rowHtml(id);
      break;
    }
    case "zip": zipStruktur(); break;
    case "ordner-reset": CUR.ordner_check = null; scheduleHead(); renderOrdner(); break;
    case "xlsx": doXlsx(); break;
    case "print": doPrint(); break;
  }
});
$("#btn-home").addEventListener("click", zurueck);

/* Eingaben in den Prüfzeilen */
document.addEventListener("input", e => {
  const el = e.target;
  const row = el.closest && el.closest(".row[data-id]");
  if (row) {
    const id = row.dataset.id;
    if (el.classList.contains("r-verantw")) setField(id, { verantwortlich: el.value });
    else if (el.classList.contains("r-bem")) setField(id, { bemerkung: el.value });
    return;
  }
  if (el.id === "f-q") { fil.q = el.value; renderGruppen(); return; }
  if (el.id === "gw-firma") { CUR.firmen[secKey] = el.value; scheduleHead(); return; }
  if (el.dataset && el.dataset.pf) { setProtokoll(el.dataset.pf, el.value); return; }
  if (el.dataset && el.dataset.bpm) { setBpm(el.dataset.bpm, el.value.trim() ? el.value : ""); return; }
});
document.addEventListener("change", e => {
  const el = e.target;
  const row = el.closest && el.closest(".row[data-id]");
  if (row) {
    const id = row.dataset.id;
    if (el.classList.contains("r-vorl")) setField(id, { vorliegend: el.value });
    else if (el.classList.contains("r-status")) setField(id, { status: el.value });
    else if (el.classList.contains("r-termin")) setField(id, { termin: el.value });
    else return;
    updateRowStyles(row, id); refreshKpis();
    return;
  }
  if (el.id === "gw-scope") { CUR.scope[secKey] = el.checked; scheduleHead(); renderCheck(); const k = $("#kpis"); if (k) k.innerHTML = kpiHtml(kpis(CUR, PUNKTE)); return; }
  if (el.id === "chk-alle") { fil.alleGewerke = el.checked; renderCheck(); return; }
  if (el.id === "a-input") { const id = $("#modal-root [data-for]").dataset.for; uploadFiles(id, Array.from(el.files)); el.value = ""; return; }
  if (el.id === "o-input") { ordnerGewaehlt(el.files); return; }
});
window.addEventListener("beforeunload", e => { if (pendingPunkte.size || pendingHead) { flushAll(); e.preventDefault(); e.returnValue = ""; } });
document.addEventListener("visibilitychange", () => { if (document.hidden) flushAll(); });

/* ============ Start ============ */
async function init() {
  $("#dl-verantw").innerHTML = VERANTW_LISTE.map(v => `<option value="${esc(v)}">`).join("");
  $("#app").innerHTML = `<div class="empty">Lade …</div>`;
  try {
    await loadListe();
  } catch (e) {
    $("#app").innerHTML = `<div class="empty">Verbindung zur Datenbank fehlgeschlagen: ${esc(e.message)}<br><button type="button" class="btn" onclick="location.reload()">Erneut versuchen</button></div>`;
    return;
  }
  const pid = new URLSearchParams(location.search).get("p");
  if (pid && PRUEFUNGEN.some(p => p.id === pid)) await openPruefung(pid); else renderListe();
  // Übersicht regelmäßig auffrischen, solange gerade nichts bearbeitet wird
  setInterval(async () => {
    if (CUR || $("#mbg") || document.hidden) return;
    try { await loadListe(); if (!CUR && !$("#mbg")) renderListe(); } catch (e) {}
  }, 45000);
}
init();
</script>
